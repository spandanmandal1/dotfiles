include ~/.config/kitty/themes/Catppuccin-Mocha.conf

# Default fallback getting it from .local/share/fonts
font_family Noto Sans Mono 
# font_family JetBrainsMono Nerd Front Mono

font_size 16.0

enable_audio_bell no
disable_ligatures no

# bold_font auto
# italic_font auto
# bold_italic_font auto

shell /usr/bin/zsh
shell_integration disable

cursor_blink_interval 0

url_style curly

remember_window_size no
initial_window_width 78c
initial_window_height 23c
window_padding_width 25

background_opacity 0.80
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0

