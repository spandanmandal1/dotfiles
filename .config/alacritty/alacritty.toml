[env]
TERM = "xterm-256color"


[terminal.shell]
program = "/usr/bin/zsh"


[font]
size = 16

[font.normal]
family = "Noto Sans Mono"
style = "Regular"

[font.bold]
family = "Noto Sans Mono"
style = "Bold"

[font.italic]
family = "Noto Sans Mono"
style = "Regular"

[font.bold_italic]
family = "Noto Sans Mono"
style = "Bold"


[window]
decorations = "full"
opacity = 0.80
dimensions = { columns = 78, lines = 23 }

[window.padding]
x = 25
y = 25


[cursor]
blink_interval = 0


[bell]
animation = "EaseOutExpo"
duration = 0


[[colors.indexed_colors]]
color = "#FAB387"
index = 16

[[colors.indexed_colors]]
color = "#F5E0DC"
index = 17

[colors.primary]
background = "#1E1E2E"
foreground = "#CDD6F4"
bright_foreground = "#CDD6F4"
dim_foreground = "#CDD6F4"

[colors.cursor]
cursor = "#F5E0DC"
text = "#1E1E2E"

[colors.selection]
background = "#F5E0DC"
text = "#1E1E2E"

[colors.normal]
black = "#45475A"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#BAC2DE"

[colors.bright]
black = "#585B70"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#A6ADC8"

[colors.dim]
black = "#45475A"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#BAC2DE"

[colors.search.matches]
foreground = "#1E1E2E"
background = "#A6ADC8"

[colors.search.focused_match]
foreground = "#1E1E2E"
background = "#A6E3A1"

[colors.hints.start]
foreground = "#1E1E2E"
background = "#F9E2AF"

[colors.hints.end]
foreground = "#1E1E2E"
background = "#A6ADC8"

[colors.vi_mode_cursor]
text = "#1E1E2E"
cursor = "#B4BEFE"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
